<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appier AdCloud - Page Template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* DS_TOKENS_INJECT */

    /* ========== RESET & BASE ========== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: "Open Sans", sans-serif;
      font-size: 14px;
      background-color: rgb(237, 238, 241);
      color: rgba(0, 0, 0, 0.87);
    }

    a {
      text-decoration: none;
    }

    /* ========== LAYOUT ========== */
    .portal-layout {
      display: flex;
      height: 100vh;
    }

    /* ========== SIDEBAR — COLLAPSED (default 48px) ========== */
    .v4-jss27 {
      width: 48px;
      z-index: 2;
      flex-shrink: 0;
      white-space: nowrap;
      transition: width 200ms cubic-bezier(0.4, 0, 0.6, 1);
    }

    .v4-jss27.pinned {
      width: 224px;
    }

    .v4-jss28 {
      width: 48px;
      border: 0;
      display: flex;
      overflow: hidden;
      /* clip labels when collapsed */
      box-shadow: rgba(0, 0, 0, 0.05) 5px 0px 10px;
      transition: width 200ms cubic-bezier(0.4, 0, 0.6, 1);
      flex-direction: column;
      justify-content: space-between;
      background-color: #fff;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      z-index: 1200;
    }

    /* ===== HOVER EXPAND ===== */
    .v4-jss28:hover {
      width: 224px;
      overflow: visible;
    }

    /* Reveal labels when hovered */
    .v4-jss28:hover .v4-jss40 {
      overflow: visible;
    }

    /* ========== LOGO AREA ========== */
    .v4-jss32 {
      display: flex;
      padding: 0 12px;
      min-height: 48px;
      align-items: center;
      user-select: none;
      justify-content: flex-start;
      flex-shrink: 0;
      position: relative;
    }

    /* ========== NAV LINKS CONTAINER ========== */
    .v4-jss36 {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
    }

    /* ========== DIVIDER ========== */
    .v4-jss35 {
      height: 1px;
      margin: 0 8px 6px;
      background: rgb(217, 218, 225);
      flex-shrink: 0;
    }

    /* ========== NAV LINK (inactive) ========== */
    .v4-jss37 {
      color: rgba(0, 10, 58, 0.57);
      text-decoration: none;
      display: block;
    }

    .v4-jss37:not(.v4-jss38):hover .v4-jss39 {
      background-color: rgba(0, 10, 58, 0.05);
    }

    /* ========== NAV LINK (active) ========== */
    .v4-jss38 {
      color: rgb(41, 106, 255);
      text-decoration: none;
    }

    .v4-jss38>.v4-jss39 {
      background: currentColor;
    }

    .v4-jss38 .v4-jss40 {
      color: rgb(255, 255, 255);
    }

    .v4-jss38 svg path {
      fill: rgb(255, 255, 255);
      fill-opacity: 1;
    }

    .v4-jss38 svg use {
      fill: rgb(255, 255, 255);
      fill-opacity: 1;
    }

    .v4-jss38 svg rect {
      fill: none;
    }

    /* ========== NAV ICON CONTAINER ========== */
    .v4-jss39 {
      cursor: pointer;
      display: flex;
      padding: 12px;
      align-items: center;
      /* prevent hover background from being clipped */
    }

    .v4-jss39>svg {
      color: rgba(0, 10, 58, 0.57);
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    /* ========== NAV LABEL (hidden when collapsed) ========== */
    .v4-jss40 {
      flex: 1 1 0%;
      color: rgba(0, 10, 58, 0.7);
      display: flex;
      overflow: hidden;
      /* hidden by default */
      width: 0;
      font-size: 14px;
      font-style: normal;
      align-items: center;
      font-weight: 600;
      line-height: 20px;
      margin-left: 16px;
      text-overflow: ellipsis;
      letter-spacing: 0.2px;
      white-space: nowrap;
      transition: width 200ms cubic-bezier(0.4, 0, 0.6, 1),
        opacity 150ms ease;
      opacity: 0;
    }

    /* Show labels when sidebar is hovered */
    .v4-jss28:hover .v4-jss40 {
      width: auto;
      opacity: 1;
      overflow: visible;
    }

    /* Active item label override */
    .v4-jss38 .v4-jss40 {
      color: rgb(255, 255, 255);
    }

    /* Active label text */
    .v4-jss42 {
      display: -webkit-box;
      overflow: hidden;
      word-break: break-word;
      white-space: normal;
      text-overflow: ellipsis;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    /* Active indicator (lock icon) */
    .v4-jss44 {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      margin-left: 8px;
    }

    /* Hide lock icon in collapsed state, show on hover */
    .v4-jss44 {
      opacity: 0;
      transition: opacity 150ms ease;
    }

    .v4-jss28:hover .v4-jss44 {
      opacity: 1;
    }

    /* ========== LOGO AREA - EXPANDED ========== */

    /* ========== SIDEBAR WORDMARK ========== */
    .sidebar-wordmark {
      opacity: 0;
      width: 0;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      transition: opacity 150ms ease, width 200ms cubic-bezier(0.4, 0, 0.6, 1);
    }

    .v4-jss28:hover .sidebar-wordmark,
    .v4-jss28.pinned .sidebar-wordmark {
      opacity: 1;
      width: auto;
    }

    .v4-jss28:hover .sidebar-logo-icon,
    .v4-jss28.pinned .sidebar-logo-icon {
      display: none;
    }

    /* ========== PIN BUTTON ========== */
    .sidebar-pin-btn {
      background: none;
      border: none;
      cursor: pointer;
      width: 32px;
      height: 32px;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      opacity: 0;
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      transition: opacity 150ms ease, background-color 150ms ease;
    }

    .sidebar-pin-btn:hover {
      background-color: rgba(0, 10, 58, 0.05);
    }

    .v4-jss28:hover .sidebar-pin-btn,
    .v4-jss28.pinned .sidebar-pin-btn {
      opacity: 1;
    }

    .pin-tooltip {
      position: absolute;
      left: calc(100% + 8px);
      top: 50%;
      transform: translateY(-50%);
      background: var(--color-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 400;
      line-height: 16px;
      letter-spacing: 0.2px;
      color: var(--color-text-high);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      box-shadow: var(--shadow-m);
      transition: opacity 100ms ease;
      z-index: 200;
    }

    .sidebar-pin-btn:hover .pin-tooltip {
      opacity: 1;
    }

    .pin-icon path {
      fill: rgba(0, 10, 58, 0.57);
      transition: fill 150ms ease, fill-opacity 150ms ease;
    }

    .v4-jss28.pinned .pin-icon path {
      fill: rgb(41, 106, 255);
      fill-opacity: 1;
    }

    /* ========== PINNED STATE ========== */
    .v4-jss28.pinned {
      width: 224px;
      overflow: visible;
    }

    .v4-jss28.pinned .v4-jss40 {
      width: auto;
      opacity: 1;
      overflow: visible;
    }

    .v4-jss28.pinned .v4-jss44 {
      opacity: 1;
    }

    .v4-jss28.pinned .v4-jss46 {
      opacity: 1;
      width: auto;
    }

    /* ========== USER AVATAR AREA (bottom) ========== */
    .v4-jss43 {
      cursor: pointer;
      display: flex;
      padding: 12px;
      align-items: center;
    }

    .v4-jss43:hover {
      background-color: rgba(0, 10, 58, 0.05);
    }

    .v4-MuiAvatar-root {
      display: flex;
      width: 24px;
      height: 24px;
      min-width: 24px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      overflow: hidden;
      background: rgba(0, 10, 58, 0.07);
      flex-shrink: 0;
    }

    .v4-jss45 {
      color: rgba(0, 10, 58, 0.7);
      display: flex;
      font-size: 12px;
      align-items: center;
      font-weight: 600;
      justify-content: center;
    }

    .v4-jss46 {
      color: rgba(0, 10, 58, 0.7);
      overflow: hidden;
      font-size: 14px;
      font-style: normal;
      font-weight: 600;
      line-height: 20px;
      margin-left: 16px;
      text-overflow: ellipsis;
      letter-spacing: 0.2px;
      white-space: nowrap;
      opacity: 0;
      width: 0;
      transition: opacity 150ms ease, width 200ms cubic-bezier(0.4, 0, 0.6, 1);
    }

    .v4-jss28:hover .v4-jss46 {
      opacity: 1;
      width: auto;
    }

    /* ========== MAIN CONTENT AREA ========== */
    .v4-jss66 {
      flex: 1 1 0%;
      display: flex;
      flex-direction: column;
      min-width: 0;
      /* No z-index: a flex item with z-index creates a stacking context that traps
         position:fixed overlays (dialog/drawer masks) below the sidebar (z-index 1200).
         The sidebar is positioned above content regardless, so this is not needed. */
    }

    /* ========== TOP HEADER BAR ========== */
    .css-1td6wz2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 24px;
      background-color: rgb(255, 255, 255);
      min-height: 48px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }

    /* Page title */
    .css-b9p9v6 {
      margin: 0;
      font-style: normal;
      font-weight: 600;
      font-size: 14px;
      line-height: 20px;
      letter-spacing: 0.2px;
      font-family: "Open Sans", sans-serif;
      color: rgba(0, 0, 0, 0.87);
    }

    /* Header right actions */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Primary button */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: rgb(41, 106, 255);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 600;
      height: 32px;
      cursor: pointer;
      font-family: "Open Sans", sans-serif;
      letter-spacing: 0.2px;
      transition: background-color 0.15s ease;
    }

    .btn-primary:hover {
      background-color: rgb(26, 84, 230);
    }

    /* ========== TABLE UTILITIES ========== */
    /* Sort icons — hidden by default; muted hint on hover; active in blue */
    .sort-icon { display: none; }
    th[data-sortable]:not([data-sort]):hover .sort-down { display: block; color: rgba(0,10,58,0.3); }
    th[data-sort="asc"]  .sort-up   { display: block; color: #296AFF; }
    th[data-sort="desc"] .sort-down { display: block; color: #296AFF; }
    /* Table row states */
    .tbl-row:hover td { background: #F7F8F9 !important; }
    .tbl-row.selected td { background: #EAF1FF !important; }
    .tbl-row.selected:hover td { background: #D6E6FF !important; }
    /* Menu items */
    .menu-item:hover { background: rgba(0,10,58,0.05); }
    /* Filter pills */
    .filter-pill:hover { background: rgba(0,10,58,0.05) !important; }
    .filter-pill.open  { border-color: #296AFF !important; }

    /* ========== PAGE CONTENT PLACEHOLDER ========== */
    .page-content {
      flex: 1;
      padding: 24px;
      overflow: auto;
    }

    .content-placeholder {
      background: rgba(0, 0, 0, 0.03);
      border: 2px dashed rgba(0, 0, 0, 0.1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      color: rgba(0, 0, 0, 0.3);
      font-size: 18px;
      font-weight: 600;
    }
  </style>
</head>

  <script>
    const sidebar = document.querySelector('.v4-jss28');
    const sidebarSpacer = document.querySelector('.v4-jss27');
    var pinBtn = document.getElementById('sidebarPinBtn');
    var pinTooltip = document.getElementById('pinTooltipText');
    pinBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      sidebar.classList.toggle('pinned');
      sidebarSpacer.classList.toggle('pinned');
      var isPinned = sidebar.classList.contains('pinned');
      pinTooltip.textContent = isPinned ? 'Unpin menu' : 'Pin menu';
      pinBtn.setAttribute('aria-label', isPinned ? 'Unpin menu' : 'Pin menu');
    });

    // positionMenu — use for any floating menu/dropdown inside overflow:hidden ancestors.
    // position:fixed avoids clipping; _trigger lets the scroll handler reposition the open menu.
    function positionMenu(btn, menu) {
      var r = btn.getBoundingClientRect();
      menu.style.display = 'block';
      var mw = menu.offsetWidth, mh = menu.offsetHeight;
      menu.style.left = Math.max(8, r.right - mw) + 'px';
      menu.style.top  = (r.bottom + 4 + mh > window.innerHeight - 8)
                        ? r.top - mh - 4 + 'px' : r.bottom + 4 + 'px';
      menu._trigger = btn;
    }
    // Reposition any open .menu-panel when any scrollable container scrolls.
    document.addEventListener('scroll', function() {
      document.querySelectorAll('.menu-panel').forEach(function(m) {
        if (m.style.display === 'block' && m._trigger) positionMenu(m._trigger, m);
      });
    }, true);

    // Sort headers — unsorted → asc → desc → unsorted; only the active column shows its icon.
    // Requires th[data-sortable] with .sort-up/.sort-down SVGs inside. See components/table.md.
    document.querySelectorAll('th[data-sortable]').forEach(function(th) {
      th.addEventListener('click', function(e) {
        if (e.target.closest('.resize-handle')) return;
        var cur = th.dataset.sort;
        document.querySelectorAll('th[data-sortable]').forEach(function(t) { t.removeAttribute('data-sort'); });
        if (!cur) { th.dataset.sort = 'asc'; }
        else if (cur === 'asc') { th.dataset.sort = 'desc'; }
        // desc → no attribute (unsorted)
      });
    });
  </script>
